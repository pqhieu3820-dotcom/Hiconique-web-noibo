<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tài chính công ty · HICONIQUE</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/portal.css">
  <link rel="stylesheet" href="/css/subpage.css">
  <link rel="stylesheet" href="/css/task-manager.css">
  <link rel="stylesheet" href="/css/gantt.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png" />
  <meta name="apple-mobile-web-app-title" content="HICONIQUE" />
  <link rel="manifest" href="/manifest.json" />
  <script src="/js/offline.js"></script>
  <script src="/js/gsheets-config.js"></script>
  <script src="/js/task-data.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/money-input.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js" defer></script>
  <script src="/js/finance-categories.js"></script>
  <script src="/js/finance-export.js" defer></script>
  <script src="/js/excel-standard.js" defer></script>
  <style>
    :root {
      --fn-bg: var(--color-bg); --fn-surface: var(--color-surface); --fn-border: var(--color-border);
      --fn-text: var(--color-text); --fn-muted: var(--color-text-muted); --fn-bronze: var(--color-bronze);
      --fn-green: #4F6F52; --fn-red: #A04848;
    }
    body { background: var(--fn-bg); color: var(--fn-text); font-family: 'Inter', -apple-system, sans-serif; min-height: 100vh; }
    .fn-container { max-width: 1320px; }

    .fn-locked { max-width: 480px; margin: 80px auto; text-align: center; padding: 40px 32px; background: var(--fn-surface); border: 1px solid var(--fn-border); border-radius: 18px; }
    .fn-locked svg { width: 40px; height: 40px; color: var(--fn-muted); margin-bottom: 16px; }
    .fn-locked h2 { font-size: 1.125rem; margin-bottom: 8px; }
    .fn-locked p { font-size: 0.875rem; color: var(--fn-muted); }

    .fn-hero { display: flex; align-items: center; justify-content: flex-end; gap: 20px; margin: 0 0 18px; flex-wrap: wrap; }   /* chỉ còn thanh chọn tháng + Xuất báo cáo, căn phải */
    .fn-hero-eyebrow { font-size: 0.6875rem; color: var(--fn-bronze); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; margin-bottom: 6px; }
    .fn-hero h1 { font-size: 1.625rem; font-weight: 700; margin-bottom: 6px; }
    .fn-hero p { font-size: 0.875rem; color: var(--fn-muted); max-width: 480px; }

    /* ---- layout: sidebar + content ---- */
    .fn-layout { display: flex; gap: 22px; align-items: flex-start; }
    .fn-sidebar { width: 216px; flex-shrink: 0; position: sticky; top: 16px; background: var(--fn-surface); border: 1px solid var(--fn-border); border-radius: 16px; padding: 14px 10px; }
    .fn-sidebar-group { margin-bottom: 14px; }
    .fn-sidebar-group:last-child { margin-bottom: 0; }
    .fn-sidebar-group-label { font-size: 0.625rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--fn-muted); padding: 0 10px; margin-bottom: 6px; font-weight: 600; }
    .fn-nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; font-size: 0.8125rem; color: var(--fn-text); cursor: pointer; margin-bottom: 2px; border: none; background: transparent; width: 100%; text-align: left; font-family: inherit; }
    .fn-nav-item svg { width: 15px; height: 15px; flex-shrink: 0; opacity: 0.8; }
    .fn-nav-item:hover { background: var(--fn-bg); }
    .fn-nav-item.active { background: color-mix(in srgb, var(--fn-bronze) 16%, transparent); color: var(--fn-bronze); font-weight: 600; }
    .fn-nav-item.active svg { opacity: 1; }
    .fn-content { flex: 1; min-width: 0; }
    .fn-section { display: none; }
    .fn-section.active { display: block; }

    .fn-summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
    .fn-summary-card { background: var(--fn-surface); border: 1px solid var(--fn-border); border-radius: 14px; padding: 18px 20px; }
    .fn-summary-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .fn-summary-icon { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; }
    .fn-summary-icon svg { width: 18px; height: 18px; }
    .fn-summary-icon.bronze { background: color-mix(in srgb, var(--fn-bronze) 14%, transparent); color: var(--fn-bronze); }
    .fn-summary-icon.green { background: color-mix(in srgb, var(--fn-green) 14%, transparent); color: var(--fn-green); }
    .fn-summary-icon.red { background: color-mix(in srgb, var(--fn-red) 14%, transparent); color: var(--fn-red); }
    .fn-summary-tag { font-size: 0.625rem; font-weight: 600; padding: 2px 8px; border-radius: 20px; background: var(--fn-bg); border: 1px solid var(--fn-border); color: var(--fn-muted); }
    .fn-summary-label { font-size: 0.6875rem; color: var(--fn-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    .fn-summary-value { font-size: 1.375rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
    .fn-summary-value.pos { color: var(--fn-green); }
    .fn-summary-value.neg { color: var(--fn-red); }
    .fn-summary-value.neutral { color: var(--fn-bronze); }

    .fn-dash-row { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; margin-bottom: 20px; align-items: stretch; }
    .fn-dash-row.split { grid-template-columns: 1fr 1.3fr; }
    .fn-dash-row.thirds { grid-template-columns: repeat(3, 1fr); }

    .fn-chart-wrap { display: flex; align-items: flex-end; gap: 12px; height: 220px; padding: 28px 20px 12px; overflow-x: auto; }
    .fn-chart-col { flex: 1; min-width: 104px; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; justify-content: flex-end; }
    .fn-chart-bars { position: relative; display: flex; gap: 26px; align-items: flex-end; height: 100%; }
    .fn-chart-bar { width: 18px; border-radius: 4px 4px 0 0; position: relative; transition: opacity 0.15s; }
    .fn-chart-bar:hover { opacity: 0.75; }
    .fn-chart-bar.revenue { background: linear-gradient(180deg, var(--fn-green), color-mix(in srgb, var(--fn-green) 70%, black)); }
    .fn-chart-bar.expense { background: linear-gradient(180deg, var(--fn-red), color-mix(in srgb, var(--fn-red) 70%, black)); }
    .fn-chart-bar.forecast { opacity: 0.45; background-image: repeating-linear-gradient(135deg, var(--fn-bronze), var(--fn-bronze) 3px, transparent 3px, transparent 6px); }
    .fn-chart-bar-value { z-index: 3; position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 0.625rem; font-family: 'JetBrains Mono', monospace; color: var(--fn-muted); white-space: nowrap; }
    .fn-chart-bar.revenue .fn-chart-bar-value { left: auto; right: 50%; transform: none; padding-right: 3px; }
    .fn-chart-bar.expense .fn-chart-bar-value { left: 50%; transform: none; padding-left: 3px; }
    .fn-chart-label { font-size: 0.75rem; color: var(--fn-muted); font-weight: 600; white-space: nowrap; }
    .fn-chart-label.is-forecast { color: var(--fn-bronze); }
    .fn-legend { display: flex; gap: 16px; padding: 0 24px 18px; font-size: 0.75rem; color: var(--fn-muted); flex-wrap: wrap; }
    .fn-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .fn-legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
    .fn-legend i.dashed { background: repeating-linear-gradient(135deg, var(--fn-bronze), var(--fn-bronze) 2px, transparent 2px, transparent 4px); }

    .fn-donut-wrap { display: flex; align-items: center; gap: 24px; padding: 24px; flex-wrap: wrap; }
    .fn-donut-wrap svg { width: 150px; height: 150px; flex-shrink: 0; }
    .fn-donut-center { font-family: 'JetBrains Mono', monospace; }
    .fn-donut-legend { flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: 10px; }
    .fn-donut-legend-row { display: flex; align-items: center; gap: 10px; font-size: 0.8125rem; }
    .fn-donut-dot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
    .fn-donut-legend-name { flex: 1; color: var(--fn-text); }
    .fn-donut-legend-pct { font-family: 'JetBrains Mono', monospace; color: var(--fn-muted); font-size: 0.75rem; }

    .fn-rank-list { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
    .fn-rank-row-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-size: 0.8125rem; }
    .fn-rank-name { font-weight: 600; }
    .fn-rank-amount { font-family: 'JetBrains Mono', monospace; color: var(--fn-muted); font-size: 0.75rem; }
    .fn-rank-track { height: 8px; border-radius: 6px; background: var(--fn-bg); overflow: hidden; }
    .fn-rank-fill { height: 100%; border-radius: 6px; }

    .fn-attention-list { padding: 8px 0; }
    .fn-attention-row { display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 1px solid var(--fn-border); }
    .fn-attention-row:last-child { border-bottom: none; }
    .fn-attention-icon { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex-shrink: 0; }
    .fn-attention-icon svg { width: 15px; height: 15px; }
    .fn-attention-body { flex: 1; min-width: 0; }
    .fn-attention-title { font-size: 0.8125rem; font-weight: 600; }
    .fn-attention-sub { font-size: 0.75rem; color: var(--fn-muted); }
    .fn-attention-count { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 0.9375rem; }

    .fn-card { background: var(--fn-surface); border: 1px solid var(--fn-border); border-radius: 18px; overflow: hidden; margin-bottom: 22px; }
    .fn-card-head { padding: 18px 24px; border-bottom: 1px solid var(--fn-border); background: var(--fn-bg); display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .fn-card-title { font-size: 1rem; font-weight: 600; }
    .fn-card-desc { font-size: 0.8125rem; color: var(--fn-muted); margin-top: 4px; }
    .fn-section-head { margin-bottom: 16px; }
    .fn-section-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 4px; }
    .fn-section-desc { font-size: 0.8125rem; color: var(--fn-muted); }

    .fn-form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; padding: 20px 24px; align-items: end; }
    .fn-form-grid.cols5 { grid-template-columns: repeat(5, 1fr); }
    .fn-field-label { display: block; font-size: 0.6875rem; color: var(--fn-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    .fn-actor-row { display: flex; gap: 10px; } .fn-actor-row > * { flex: 1; min-width: 0; } .fn-actor-row [hidden] { display: none; }
    .fn-form-grid { align-items: start; } .fn-form-grid .fn-field-label { display: block; margin-bottom: 6px; min-height: 14px; line-height: 14px; }
    #fnAddBtn { height: 38px; margin-top: 20px; }
    .fn-table th { white-space: nowrap; }
    .fn-info-btn { width: 15px; height: 15px; border-radius: 50%; border: 1px solid var(--fn-muted); background: none; color: var(--fn-muted); font: italic 0.625rem Georgia, serif; cursor: pointer; padding: 0; margin-left: 4px; vertical-align: 1px; }
    .fn-info-btn:hover { color: var(--fn-bronze); border-color: var(--fn-bronze); }
    .fn-counter-info { border: 1px dashed var(--fn-border); border-radius: 10px; padding: 12px 14px; font-size: 0.75rem; color: var(--fn-muted); line-height: 1.5; max-height: 300px; overflow: auto; background: var(--fn-bg); }
    .fn-counter-info[hidden] { display: none; }
    .fn-ci-ex { display: grid; gap: 4px; margin: 8px 0; color: var(--fn-text); }
    .fn-ledger-wrap { overflow-x: auto; } .fn-ledger { min-width: 1080px; } .fn-ledger td.num, .fn-ledger th.num { text-align: right; font-variant-numeric: tabular-nums; } .fn-ledger .neg { color: var(--fn-red); } .fn-ledger tfoot td { font-weight: 700; background: var(--fn-bg); }
    .fn-clickable { cursor: pointer; transition: transform .15s, box-shadow .15s, border-color .15s; }
    .fn-summary-card.fn-clickable:hover, .fn-card.fn-clickable:hover { transform: translateY(-2px); border-color: var(--fn-bronze); box-shadow: 0 10px 26px rgba(0,0,0,.08); }
    .fn-chart-col.fn-clickable:hover .fn-chart-label { color: var(--fn-bronze); }
    .fn-chart-col.fn-clickable:hover { background: color-mix(in srgb, var(--fn-bronze) 8%, transparent); border-radius: 8px; }
    .fn-dt-overlay { position: fixed; inset: 0; z-index: 500; background: rgba(10,12,15,.5); backdrop-filter: blur(3px); display: flex; align-items: flex-start; justify-content: center; padding: 5vh 16px; overflow-y: auto; }
    .fn-dt-box { width: 100%; max-width: 980px; background: var(--fn-bg); border: 1px solid var(--fn-border); border-radius: 16px; box-shadow: 0 24px 60px rgba(0,0,0,.35); animation: fnDtIn .22s ease; }
    @keyframes fnDtIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .fn-dt-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 18px 24px 12px; border-bottom: 1px solid var(--fn-border); }
    .fn-dt-title { font-size: 1.125rem; font-weight: 700; } .fn-dt-sub { font-size: 0.8125rem; color: var(--fn-muted); margin-top: 2px; }
    .fn-dt-x { background: none; border: none; font-size: 1.6rem; line-height: 1; color: var(--fn-muted); cursor: pointer; }
    .fn-dt-body { padding: 16px 24px 22px; }
    .fn-dt-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .fn-dt-stat { background: var(--fn-surface); border: 1px solid var(--fn-border); border-radius: 12px; padding: 10px 14px; }
    .fn-dt-stat b { display: block; font: 700 1.05rem 'JetBrains Mono', monospace; } .fn-dt-stat span { font-size: 0.6875rem; color: var(--fn-muted); text-transform: uppercase; letter-spacing: .04em; }
    .fn-dt-stat.pos b { color: var(--fn-green); } .fn-dt-stat.neg b { color: var(--fn-red); }
    .fn-dt-sec { margin-top: 16px; } .fn-dt-sec h4 { margin: 0 0 8px; font-size: 0.875rem; display: flex; justify-content: space-between; gap: 10px; }
    .fn-dt-wrap { overflow-x: auto; border: 1px solid var(--fn-border); border-radius: 10px; background: var(--fn-surface); }
    .fn-dt-table { width: 100%; border-collapse: collapse; font-size: 0.8125rem; min-width: 760px; } .fn-dt-table th { text-align: left; font-size: 0.6875rem; text-transform: uppercase; letter-spacing: .04em; color: var(--fn-muted); padding: 8px 10px; border-bottom: 1px solid var(--fn-border); white-space: nowrap; }
    .fn-dt-table td { padding: 8px 10px; border-bottom: 1px solid var(--fn-border); vertical-align: top; } .fn-dt-table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .fn-dt-table .pos { color: var(--fn-green); } .fn-dt-table .neg { color: var(--fn-red); } .fn-dt-empty { padding: 18px; text-align: center; color: var(--fn-muted); font-size: 0.8125rem; }
    .fn-dt-note { font-size: 0.75rem; color: var(--fn-muted); margin-top: 6px; }
    .fn-vmsg { min-height: 0; margin-top: 4px; font-size: 0.6875rem; color: var(--fn-muted); }
    .fn-vmsg.ok { color: var(--fn-green); } .fn-vmsg.bad { color: var(--fn-red); }
    .fn-hint { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--fn-bronze); }
    .fn-combo { position: relative; }
    .fn-combo-list { position: absolute; z-index: 60; left: calc(100% + 10px); top: -6px; width: 300px; max-height: 320px; overflow-y: auto; padding: 6px; background: var(--fn-surface, #fff); border: 1px solid var(--fn-border); border-radius: 12px; box-shadow: 0 14px 34px rgba(0,0,0,0.16); }
    .fn-combo-list[hidden] { display: none; }
    .fn-card:has(.fn-combo), .fn-card:has(.fn-combo) .fn-form-grid { overflow: visible; }
    @media (max-width: 900px) { .fn-combo-list { left: 0; top: calc(100% + 6px); width: 100%; } }
    .fn-combo-item { padding: 9px 12px; border-radius: 8px; font-size: 0.8125rem; font-weight: 500; color: var(--fn-text); cursor: pointer; line-height: 1.35; }
    .fn-combo-item:hover { background: rgba(176,141,87,0.14); color: var(--fn-bronze, #B08D57); }
    .fn-combo-empty { padding: 10px 12px; font-size: 0.75rem; color: var(--fn-muted, #7A7568); }
    .fn-access-note { margin: 0; padding: 4px 24px 20px; font-size: 0.8125rem; color: var(--fn-muted, #7A7568); line-height: 1.5; }
    .fn-input, .fn-select { width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--fn-border); background: var(--fn-bg); color: var(--fn-text); font-family: inherit; font-size: 0.8125rem; }
    .fn-input.mono { font-family: 'JetBrains Mono', monospace; }

    .fn-btn { padding: 9px 16px; border-radius: 9px; border: none; font-family: inherit; font-size: 0.8125rem; font-weight: 600; cursor: pointer; }
    .fn-btn-primary { background: var(--fn-bronze); color: #0B0D10; }
    .fn-btn-primary:hover { background: #C7A464; }
    .fn-btn-ghost { background: transparent; border: 1px solid var(--fn-border); color: var(--fn-text); }
    .fn-btn-ghost:hover { border-color: var(--fn-bronze); color: var(--fn-bronze); }
    .fn-btn-sm { padding: 6px 12px; font-size: 0.75rem; border-radius: 7px; }
    .fn-month-input { padding: 9px 12px; border-radius: 9px; border: 1px solid var(--fn-border); background: var(--fn-bg); color: var(--fn-text); font-family: inherit; font-size: 0.875rem; }

    .fn-table { width: 100%; border-collapse: collapse; font-size: 0.8125rem; }
    .fn-table th { text-align: left; font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--fn-muted); font-weight: 600; padding: 10px 24px; background: var(--fn-bg); border-bottom: 1px solid var(--fn-border); }
    .fn-table td { padding: 10px 24px; border-bottom: 1px solid var(--fn-border); vertical-align: middle; }
    .fn-table tr:last-child td { border-bottom: none; }
    .fn-amount { font-family: 'JetBrains Mono', monospace; font-weight: 600; white-space: nowrap; }
    .fn-amount.pos { color: var(--fn-green); }
    .fn-amount.neg { color: var(--fn-red); }
    .fn-type-badge { font-size: 0.6875rem; font-weight: 600; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
    .fn-status-badge { font-size: 0.6875rem; font-weight: 600; padding: 3px 10px; border-radius: 20px; white-space: nowrap; border: 1px solid; }
    .fn-status-badge.unpaid { color: var(--fn-bronze); border-color: color-mix(in srgb, var(--fn-bronze) 40%, transparent); background: color-mix(in srgb, var(--fn-bronze) 10%, transparent); }
    .fn-status-badge.paid { color: var(--fn-green); border-color: color-mix(in srgb, var(--fn-green) 40%, transparent); background: color-mix(in srgb, var(--fn-green) 10%, transparent); }
    .fn-status-badge.overdue { color: var(--fn-red); border-color: color-mix(in srgb, var(--fn-red) 40%, transparent); background: color-mix(in srgb, var(--fn-red) 10%, transparent); }
    .fn-verdict { font-size: 0.6875rem; font-weight: 600; padding: 3px 10px; border-radius: 20px; white-space: nowrap; border: 1px solid; }
    .fn-verdict.good { color: var(--fn-green); border-color: color-mix(in srgb, var(--fn-green) 40%, transparent); background: color-mix(in srgb, var(--fn-green) 10%, transparent); }
    .fn-verdict.warn { color: var(--fn-bronze); border-color: color-mix(in srgb, var(--fn-bronze) 40%, transparent); background: color-mix(in srgb, var(--fn-bronze) 10%, transparent); }
    .fn-verdict.bad { color: var(--fn-red); border-color: color-mix(in srgb, var(--fn-red) 40%, transparent); background: color-mix(in srgb, var(--fn-red) 10%, transparent); }
    .fn-verdict.neutral { color: var(--fn-muted); border-color: var(--fn-border); background: var(--fn-bg); }
    .fn-formula-cell { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--fn-muted); }
    .fn-empty { padding: 32px 24px; text-align: center; color: var(--fn-muted); font-size: 0.875rem; }

    /* P&L statement */
    .fn-pnl-table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    .fn-pnl-table td { padding: 12px 24px; border-bottom: 1px solid var(--fn-border); }
    .fn-pnl-table tr.fn-pnl-total td { border-top: 2px solid var(--fn-border); border-bottom: none; font-weight: 700; font-size: 1rem; padding-top: 16px; }
    .fn-pnl-table tr.fn-pnl-sub td:first-child { padding-left: 40px; color: var(--fn-muted); }
    .fn-pnl-label { }
    .fn-pnl-delta { font-size: 0.75rem; margin-left: 8px; padding: 1px 7px; border-radius: 10px; font-family: 'JetBrains Mono', monospace; }
    .fn-pnl-delta.up { color: var(--fn-green); background: color-mix(in srgb, var(--fn-green) 12%, transparent); }
    .fn-pnl-delta.down { color: var(--fn-red); background: color-mix(in srgb, var(--fn-red) 12%, transparent); }

    /* Health scorecard */
    .fn-score-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }

    function ledgerData() {
      var acc = document.getElementById('fnLgAcc').value, from = document.getElementById('fnLgFrom').value, to = document.getElementById('fnLgTo').value;
      var rows = TaskManager.getFinanceEntries().filter(function (e) { return TYPES[e.type] && TYPES[e.type].cashSign !== 0 && String(e.account || '111') === acc; })
        .sort(function (a, b) { return String(a.date || '').localeCompare(String(b.date || '')) || String(a.createdAt || '').localeCompare(String(b.createdAt || '')); });
      var opening = 0;
      rows.forEach(function (e) { if (from && e.date < from) opening += TYPES[e.type].cashSign * (Number(e.amount) || 0); });
      var run = opening, list = [], sumIn = 0, sumOut = 0;
      rows.forEach(function (e) {
        if ((from && e.date < from) || (to && e.date > to)) return;
        var s = TYPES[e.type].cashSign, amt = Number(e.amount) || 0;
        run += s * amt; if (s > 0) sumIn += amt; else sumOut += amt;
        list.push({ e: e, inAmt: s > 0 ? amt : 0, outAmt: s < 0 ? amt : 0, bal: run });
      });
      return { acc: acc, from: from, to: to, opening: opening, list: list, sumIn: sumIn, sumOut: sumOut, closing: run };
    }

    function renderOverview(all, monthEntries, month) {
      var revenueM = sumByType(monthEntries, 'revenue');
      var expenseM = sumByType(monthEntries, 'expense');
      var bonusM = sumByType(monthEntries, 'bonus');
      var penaltyM = sumByType(monthEntries, 'penalty');
      var pnlMonth = revenueM - expenseM - bonusM + penaltyM;

      var cashFlowAllTime = all.reduce(function (sum, e) {
        var t = TYPES[e.type];

    function summaryCard(label, value, cls, icon, iconCls, tag, detail) {

        '<div class="fn-summary-top">' +

    // Biểu đồ thu/chi N tháng gần nhất (+ forecastMonths tháng dự báo phía sau) — tự vẽ bằng div.
    function renderChart(targetId, all, historyMonths, forecastMonths) {
      var months = [];
      var now = new Date();
      for (var i = historyMonths - 1; i >= 0; i--) {
        var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        months.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));
      }
      var data = months.map(function (m) {
        var entries = all.filter(function (e) { return e.month === m; });
        return { month: m, revenue: sumByType(entries, 'revenue'), expense: sumByType(entries, 'expense'), forecast: false };
      });

      if (forecastMonths > 0) {
        var lastN = data.slice(-3);
        var avgRev = lastN.reduce(function (s, d2) { return s + d2.revenue; }, 0) / (lastN.length || 1);
        var avgExp = lastN.reduce(function (s, d2) { return s + d2.expense; }, 0) / (lastN.length || 1);
        for (var f = 1; f <= forecastMonths; f++) {
          var fd = new Date(now.getFullYear(), now.getMonth() + f, 1);
          data.push({
            month: fd.getFullYear() + '-' + String(fd.getMonth() + 1).padStart(2, '0'),
            revenue: avgRev, expense: avgExp, forecast: true
          });
        }
      }

      var max = Math.max.apply(null, data.map(function (d) { return Math.max(d.revenue, d.expense); }).concat([1]));
      var maxBarPx = 160;
      document.getElementById(targetId).innerHTML = data.map(function (d) {
        var rH = Math.max(3, Math.round((d.revenue / max) * maxBarPx));
        var eH = Math.max(3, Math.round((d.expense / max) * maxBarPx));
        var fcls = d.forecast ? ' forecast' : '';
        return '<div class="fn-chart-col fn-clickable" data-detail="month:' + d.month + '" title="Bấm để xem chi tiết tháng ' + d.month + '">' +
          '<div class="fn-chart-bars">' +
            '<div class="fn-chart-bar revenue' + fcls + '" style="height:' + rH + 'px;" title="Thu: ' + fmt(d.revenue) + '">' +
              (d.revenue > 0 ? '<span class="fn-chart-bar-value">' + fmtShort(d.revenue) + '</span>' : '') +
            '</div>' +
            '<div class="fn-chart-bar expense' + fcls + '" style="height:' + eH + 'px;" title="Chi: ' + fmt(d.expense) + '">' +
              (d.expense > 0 ? '<span class="fn-chart-bar-value">' + fmtShort(d.expense) + '</span>' : '') +
            '</div>' +
          '</div>' +
          '<span class="fn-chart-label' + (d.forecast ? ' is-forecast' : '') + '">Th.' + Number(d.month.slice(5)) + (d.forecast ? ' *' : '') + '</span>' +
        '</div>';
      }).join('');
    }

    // Rút gọn số tiền lớn cho gọn nhãn trên biểu đồ (1.500.000 -> 1.5tr).
    function fmtShort(n) {
      n = Number(n) || 0;
      if (n >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, '') + ' tỷ';
      if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + ' tr';
      if (n >= 1e3) return Math.round(n / 1e3) + 'k';
      return fmt(n);
    }

    var DONUT_PALETTE = ['#B08D57', '#A04848', '#3B6B8C', '#4F6F52', '#8E7CC3', '#C7A464'];

    function categoryBreakdown(entries) {
      var byCat = {};
      entries.filter(function (e) { return e.type === 'expense'; }).forEach(function (e) {
        var c = (e.category || '').trim() || 'Khác';
        byCat[c] = (byCat[c] || 0) + (Number(e.amount) || 0);
      });
      var list = Object.keys(byCat).map(function (k) { return { name: k, value: byCat[k] }; })
        .sort(function (a, b) { return b.value - a.value; });
      if (list.length > 6) {
        var top = list.slice(0, 5);
        var restTotal = list.slice(5).reduce(function (s, e) { return s + e.value; }, 0);
        top.push({ name: 'Khác', value: restTotal });
        list = top;
      }
      return list;
    }

    function renderDonut(monthEntries) {
      var wrap = document.getElementById('fnDonutWrap');
      var list = categoryBreakdown(monthEntries);
      var total = list.reduce(function (s, e) { return s + e.value; }, 0);
      if (total === 0) {
        wrap.innerHTML = '<div class="fn-empty" style="padding:12px 0;">Chưa có chi phí nào trong tháng này.</div>';
        return;
      }
      var r = 58, c = 70, circ = 2 * Math.PI * r;
      var offset = 0;
      var segments = list.map(function (e, i) {
        var dash = (e.value / total) * circ;
        var seg = '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke="' + DONUT_PALETTE[i % DONUT_PALETTE.length] + '" stroke-width="20" ' +
          'stroke-dasharray="' + dash + ' ' + (circ - dash) + '" stroke-dashoffset="' + (-offset) + '" transform="rotate(-90 ' + c + ' ' + c + ')"></circle>';
        offset += dash;
        return seg;
      }).join('');
      wrap.innerHTML =
        '<div style="position:relative;width:150px;height:150px;flex-shrink:0;">' +
          '<svg viewBox="0 0 140 140">' + segments + '<circle cx="70" cy="70" r="46" fill="var(--fn-surface)"></circle></svg>' +
          '<div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center;">' +
            '<div><div class="fn-donut-center" style="font-size:1.0625rem;font-weight:700;">' + fmtShort(total) + '</div>' +
            '<div style="font-size:0.625rem;color:var(--fn-muted);text-transform:uppercase;letter-spacing:0.05em;">Tổng chi</div></div>' +
          '</div>' +
        '</div>' +
        '<div class="fn-donut-legend">' + list.map(function (e, i) {
          var pct = Math.round((e.value / total) * 100);
          return '<div class="fn-donut-legend-row">' +
            '<span class="fn-donut-dot" style="background:' + DONUT_PALETTE[i % DONUT_PALETTE.length] + '"></span>' +
            '<span class="fn-donut-legend-name">' + escapeHtml(e.name) + '</span>' +
            '<span class="fn-donut-legend-pct">' + pct + '%</span>' +
          '</div>';
        }).join('') + '</div>';
    }

    function renderRankList(monthEntries) {
      var el = document.getElementById('fnRankList');
      var list = categoryBreakdown(monthEntries);
      if (list.length === 0) {
        el.innerHTML = '<div class="fn-empty" style="padding:12px 0;">Chưa có chi phí nào trong tháng này.</div>';
        return;
      }
      var max = list[0].value || 1;
      el.innerHTML = list.slice(0, 6).map(function (e, i) {
        var pct = Math.max(3, Math.round((e.value / max) * 100));
        return '<div>' +
          '<div class="fn-rank-row-top"><span class="fn-rank-name">' + escapeHtml(e.name) + '</span><span class="fn-rank-amount">' + fmt(e.value) + '</span></div>' +
          '<div class="fn-rank-track"><div class="fn-rank-fill" style="width:' + pct + '%;background:' + DONUT_PALETTE[i % DONUT_PALETTE.length] + ';"></div></div>' +
        '</div>';
      }).join('');
    }

    function renderAttention(targetId, ctx) {
      var items = [];
      if (ctx.pnlMonth < 0) {
        items.push({ icon: ICONS.warn, cls: 'red', title: 'Lỗ trong tháng ' + ctx.month, sub: 'Chi phí đang vượt doanh thu', count: fmt(ctx.pnlMonth) });

        items.push({ icon: ICONS.debt, cls: 'red', title: 'Còn dư nợ vay', sub: 'Chưa trả hết các khoản đã vay', count: fmt(ctx.debtOutstanding) });
      }
      if (ctx.idlePool > 0) {
        items.push({ icon: ICONS.idle, cls: 'bronze', title: 'Tiền ứ đọng / chưa giải ngân', sub: 'Cần rà soát để giải ngân hoặc thu hồi', count: fmt(ctx.idlePool) });
      }
      if (ctx.cashFlowAllTime < 0) {

    // ============================== PHÂN QUYỀN (chỉ Founder) ==============================
    function renderAccess() {
      var rows = document.getElementById('fnAccessRows'), pick = document.getElementById('fnAccessPick');
      if (!rows || !pick || !TaskManager.canGrantFinanceAccess(user)) return;
      var list = TaskManager.getFinanceAccess();
      rows.innerHTML = list.length ? list.map(function (a) {
        var m = TaskManager.getMember(a.memberId) || {};
        return '<tr><td>' + escapeHtml(a.memberName || m.name || a.memberId) + '</td><td>' + escapeHtml(m.role || '') + '</td><td>' + escapeHtml(a.grantedBy || '') + '</td><td>' + escapeHtml(a.createdAt || '') + '</td>' +
          '<td><button class="fn-btn fn-btn-ghost fn-btn-sm" data-revoke-access="' + escapeHtml(a.id) + '">Xoá quyền</button></td></tr>';
      }).join('') : '<tr><td colspan="5" class="fn-empty">Chưa cấp quyền riêng cho ai (CEO/Admin luôn có quyền sẵn).</td></tr>';
      var granted = {}; list.forEach(function (a) { granted[a.memberId] = true; });
      var cands = (TaskManager.getActiveMembers ? TaskManager.getActiveMembers() : TaskManager.getMembers()).filter(function (m) { return !granted[m.id] && m.roleLevel !== 'admin' && m.level !== 'founder'; });
      pick.innerHTML = cands.length ? cands.map(function (m) { return '<option value="' + escapeHtml(m.id) + '">' + escapeHtml(m.name) + (m.role ? ' — ' + escapeHtml(m.role) : '') + '</option>'; }).join('') : '<option value="">(không còn thành viên để cấp)</option>';
      rows.querySelectorAll('[data-revoke-access]').forEach(function (b) {
        b.addEventListener('click', function () { if (!confirm('Thu hồi quyền truy cập Sổ tài chính của người này?')) return; TaskManager.revokeFinanceAccess(b.getAttribute('data-revoke-access'), user); renderAccess(); });
      });
      var addBtn = document.getElementById('fnAccessAdd');
      if (addBtn && !addBtn.dataset.bound) {
        addBtn.dataset.bound = '1';
        addBtn.addEventListener('click', function () {
          var id = pick.value; if (!id) return;
          TaskManager.grantFinanceAccess(id, user); renderAccess();
        });
      }
    }

    // ============================== TRANSACTIONS ==============================

      document.getElementById('fnListTitle').textContent = 'Giao dịch tháng ' + month.slice(5, 7) + '-' + month.slice(0, 4);   // 2026-09 → 09-2026

          '<td>' + counterCell(e) + '</td>' +
          '<td>' + escapeHtml(e.description || '') + '</td>' +
          '<td>' + escapeHtml(e.actor || '—') + '</td>' +
          '<td>' + escapeHtml(e.date || '') + '</td>' +

    // ============================== RECEIVABLES ==============================
    function receivableStatus(r) {
      if (r.status === 'paid') return 'paid';
      if (r.dueDate && r.dueDate < new Date().toISOString().split('T')[0]) return 'overdue';
      return 'unpaid';
    }
    var STATUS_LABEL = { unpaid: 'Chưa thu', paid: 'Đã thu', overdue: 'Quá hạn' };

    function renderReceivablesList() {
      var list = TaskManager.getReceivables();
      var rows = document.getElementById('fnRcvRows');
      if (!list || list.length === 0) {
        rows.innerHTML = '<tr><td colspan="7" class="fn-empty">Chưa có công nợ nào được ghi nhận.</td></tr>';
        return;
      }
      rows.innerHTML = list.map(function (r) {
        var st = receivableStatus(r);
        return '<tr>' +
          '<td>' + escapeHtml(r.clientName || '—') + '</td>' +
          '<td>' + escapeHtml(r.projectId || '—') + '</td>' +
          '<td>' + escapeHtml(r.description || '') + '</td>' +
          '<td>' + escapeHtml(r.dueDate || '') + '</td>' +
          '<td class="fn-amount pos">' + fmt(r.amount) + '</td>' +
          '<td><span class="fn-status-badge ' + st + '">' + STATUS_LABEL[st] + '</span></td>' +
          '<td style="display:flex;gap:6px;">' +
            (st !== 'paid' ? '<button class="fn-btn fn-btn-ghost fn-btn-sm" data-mark-paid="' + r.id + '">Đã thu</button>' : '') +
            '<button class="fn-btn fn-btn-ghost fn-btn-sm" data-delete-rcv="' + r.id + '">Xoá</button>' +
          '</td>' +
        '</tr>';
      }).join('');

      rows.querySelectorAll('[data-mark-paid]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = btn.getAttribute('data-mark-paid');
          var r = list.find(function (x) { return x.id === id; });
          if (!r) return;
          if (!confirm('Xác nhận đã thu ' + fmt(r.amount) + ' từ ' + r.clientName + '? Hệ thống sẽ tự tạo một khoản Doanh thu tương ứng.')) return;
          TaskManager.updateReceivable(id, { status: 'paid' }, user);
          var today = new Date().toISOString().split('T')[0];
          TaskManager.createFinanceEntry({
            type: 'revenue',
            category: 'Thu công nợ',
            description: 'Thu nợ: ' + (r.clientName || '') + (r.projectId ? ' (' + r.projectId + ')' : ''),
            amount: r.amount,
            date: today,
            month: today.slice(0, 7)
          }, user);
          renderAll();
        });
      });
      rows.querySelectorAll('[data-delete-rcv]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (!confirm('Xoá công nợ này?')) return;
          TaskManager.deleteReceivable(btn.getAttribute('data-delete-rcv'), user);
          renderAll();
        });
      });
    }

    // ============================== P&L ==============================
    function pnlForMonth(all, month) {
      var entries = all.filter(function (e) { return e.month === month; });
      var revenue = sumByType(entries, 'revenue');
      var expense = sumByType(entries, 'expense');
      var bonus = sumByType(entries, 'bonus');
      var penalty = sumByType(entries, 'penalty');
      var net = revenue - expense - bonus + penalty;
      return { revenue: revenue, expense: expense, bonus: bonus, penalty: penalty, net: net };
    }

    function pnlDeltaSpan(cur, prev) {
      if (!prev) return '';
      var diff = cur - prev;
      if (diff === 0) return '';
      var pct = prev !== 0 ? Math.round((diff / Math.abs(prev)) * 100) : 100;
      var cls = diff >= 0 ? 'up' : 'down';
      var arrow = diff >= 0 ? '▲' : '▼';
      return '<span class="fn-pnl-delta ' + cls + '">' + arrow + ' ' + Math.abs(pct) + '% so tháng trước</span>';
    }

    function renderPnl(all, month) {
      var cur = pnlForMonth(all, month);
      var prevMonth = shiftMonth(month, -1);
      var prev = pnlForMonth(all, prevMonth);
      document.getElementById('fnPnlTitle').textContent = 'Kết quả kinh doanh — Tháng ' + month;

      var rows = [
        { label: 'Doanh thu', value: cur.revenue, prevVal: prev.revenue, sign: 1 },
        { label: 'Chi phí hoạt động', value: cur.expense, prevVal: prev.expense, sign: -1, sub: true },
        { label: 'Thưởng nhân viên', value: cur.bonus, prevVal: prev.bonus, sign: -1, sub: true },
        { label: 'Phạt nhân viên (thu về)', value: cur.penalty, prevVal: prev.penalty, sign: 1, sub: true }
      ];

      document.getElementById('fnPnlTable').innerHTML =
        rows.map(function (r) {
          return '<tr' + (r.sub ? ' class="fn-pnl-sub"' : '') + '>' +
            '<td class="fn-pnl-label">' + (r.sign < 0 ? '(-) ' : '') + r.label + '</td>' +
            '<td class="fn-amount ' + (r.sign < 0 ? 'neg' : 'pos') + '" style="text-align:right;">' + fmt(r.value) + pnlDeltaSpan(r.value, r.prevVal) + '</td>' +
          '</tr>';
        }).join('') +
        '<tr class="fn-pnl-total"><td>Lợi nhuận ròng</td><td class="fn-amount ' + (cur.net >= 0 ? 'pos' : 'neg') + '" style="text-align:right;">' + fmt(cur.net) + pnlDeltaSpan(cur.net, prev.net) + '</td></tr>';
    }

    // ============================== CASH FLOW & FORECAST ==============================
    function renderCashflowForecast(all) {
      renderChart('fnFcChartWrap', all, 6, 3);

      var now = new Date();
      var last3 = [];
      for (var i = 2; i >= 0; i--) {
        var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        var m = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
        last3.push(sumByType(all.filter(function (e) { return e.month === m; }), 'revenue') - sumByType(all.filter(function (e) { return e.month === m; }), 'expense'));
      }
      var avgNet = last3.reduce(function (s, v) { return s + v; }, 0) / (last3.length || 1);
      var cashNow = all.reduce(function (sum, e) {
        var t = TYPES[e.type];
        return sum + (t ? t.cashSign : 0) * (Number(e.amount) || 0);
      }, 0);
      var proj3 = cashNow + avgNet * 3;

      document.getElementById('fnFcSummary').innerHTML =
        summaryCard('Dòng tiền tồn hiện tại', cashNow, cashNow >= 0 ? 'pos' : 'neg', ICONS.cash, 'green', 'Hôm nay') +
        summaryCard('Trung bình lãi/lỗ 3 tháng', avgNet, avgNet >= 0 ? 'pos' : 'neg', ICONS.pnl, 'bronze', 'Cơ sở dự báo') +
        summaryCard('Dự báo tồn quỹ sau 3 tháng', proj3, proj3 >= 0 ? 'pos' : 'neg', ICONS.forecast, proj3 >= 0 ? 'green' : 'red', 'Ước tính');
    }

    // ============================== DEBT ==============================
    function renderDebt(all) {
      var loans = all.filter(function (e) { return e.type === 'loan' || e.type === 'repayment'; })
        .sort(function (a, b) { return (a.date || '').localeCompare(b.date || ''); });
      var totalLoan = sumByType(all, 'loan');
      var totalRepay = sumByType(all, 'repayment');
      var outstanding = totalLoan - totalRepay;

      document.getElementById('fnDebtSummary').innerHTML =
        summaryCard('Tổng đã vay (luỹ kế)', totalLoan, 'neutral', ICONS.debt, 'bronze', 'Tất cả thời gian') +
        summaryCard('Tổng đã trả (luỹ kế)', totalRepay, 'pos', ICONS.check, 'green', 'Tất cả thời gian') +
        summaryCard('Dư nợ hiện tại', outstanding, outstanding > 0 ? 'neg' : 'pos', ICONS.warn, outstanding > 0 ? 'red' : 'green', outstanding > 0 ? 'Còn nợ' : 'Đã trả hết');

      var rows = document.getElementById('fnDebtRows');
      if (loans.length === 0) {
        rows.innerHTML = '<tr><td colspan="5" class="fn-empty">Chưa có khoản vay/trả nợ nào.</td></tr>';
        return;
      }
      var running = 0;
      rows.innerHTML = loans.map(function (e) {
        running += e.type === 'loan' ? Number(e.amount) || 0 : -(Number(e.amount) || 0);
        var t = TYPES[e.type];
        return '<tr>' +
          '<td><span class="fn-type-badge" style="background:var(--fn-bg);border:1px solid var(--fn-border);">' + t.label + '</span></td>' +
          '<td>' + escapeHtml(e.date || '') + '</td>' +
          '<td>' + escapeHtml(e.description || e.category || '') + '</td>' +
          '<td class="fn-amount ' + t.cls + '">' + fmt(e.amount) + '</td>' +
          '<td class="fn-amount ' + (running > 0 ? 'neg' : 'pos') + '">' + fmt(running) + '</td>' +
        '</tr>';
      }).join('');
    }

    // ============================== HEALTH SCORE ==============================
    function last3MonthsTotals(all) {
      var now = new Date();
      var revenue = 0, expense = 0, months = [];
      for (var i = 2; i >= 0; i--) {
        var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        var m = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
        months.push(m);
        var entries = all.filter(function (e) { return e.month === m; });
        revenue += sumByType(entries, 'revenue');
        expense += sumByType(entries, 'expense');
      }
      return { revenue: revenue, expense: expense, months: months };
    }

    function scoreCard(label, valueLabel, pct, tagText, tagCls, color) {
      pct = Math.max(0, Math.min(100, pct));
      return '<div class="fn-score-card">' +
        '<div class="fn-score-label">' + label + '</div>' +
        '<div class="fn-score-value" style="color:' + color + ';">' + valueLabel + '</div>' +
        '<div class="fn-score-bar"><div class="fn-score-bar-fill" style="width:' + pct + '%;background:' + color + ';"></div></div>' +
        '<span class="fn-score-tag ' + tagCls + '">' + tagText + '</span>' +
      '</div>';
    }

    function renderHealth(all) {
      var t3 = last3MonthsTotals(all);
      var revenue = t3.revenue, expense = t3.expense;
      var net = revenue - sumByType(all.filter(function (e) { return t3.months.indexOf(e.month) !== -1; }), 'bonus')
        + sumByType(all.filter(function (e) { return t3.months.indexOf(e.month) !== -1; }), 'penalty') - expense;

      var margin = revenue > 0 ? (net / revenue) * 100 : 0;
      var expenseRatio = revenue > 0 ? (expense / revenue) * 100 : (expense > 0 ? 100 : 0);
      var debtOutstanding = sumByType(all, 'loan') - sumByType(all, 'repayment');
      var debtRatio = revenue > 0 ? (debtOutstanding / revenue) * 100 : (debtOutstanding > 0 ? 100 : 0);
      var avgMonthlyExpense = expense / 3;
      var cashNow = all.reduce(function (sum, e) {
        var tt = TYPES[e.type];
        return sum + (tt ? tt.cashSign : 0) * (Number(e.amount) || 0);
      }, 0);
      var runwayMonths = avgMonthlyExpense > 0 ? cashNow / avgMonthlyExpense : (cashNow > 0 ? 12 : 0);

      function tagFor(good, warn) { return good ? { cls: 'good', text: 'Tốt' } : warn ? { cls: 'warn', text: 'Cần chú ý' } : { cls: 'bad', text: 'Rủi ro' }; }

      var marginTag = tagFor(margin >= 15, margin >= 0);
      var expTag = tagFor(expenseRatio <= 70, expenseRatio <= 90);
      var debtTag = tagFor(debtRatio <= 30, debtRatio <= 60);
      var runwayTag = tagFor(runwayMonths >= 3, runwayMonths >= 1);

      document.getElementById('fnScoreGrid').innerHTML =
        scoreCard('Biên lợi nhuận (3 tháng)', margin.toFixed(1) + '%', margin + 50, marginTag.text, marginTag.cls, marginTag.cls === 'good' ? 'var(--fn-green)' : marginTag.cls === 'warn' ? 'var(--fn-bronze)' : 'var(--fn-red)') +
        scoreCard('Tỷ lệ chi phí/doanh thu', expenseRatio.toFixed(1) + '%', expenseRatio, expTag.text, expTag.cls, expTag.cls === 'good' ? 'var(--fn-green)' : expTag.cls === 'warn' ? 'var(--fn-bronze)' : 'var(--fn-red)') +
        scoreCard('Tỷ lệ nợ/doanh thu', debtRatio.toFixed(1) + '%', debtRatio, debtTag.text, debtTag.cls, debtTag.cls === 'good' ? 'var(--fn-green)' : debtTag.cls === 'warn' ? 'var(--fn-bronze)' : 'var(--fn-red)') +
        scoreCard('Dự trữ tiền mặt', runwayMonths.toFixed(1) + ' tháng', runwayMonths * 20, runwayTag.text, runwayTag.cls, runwayTag.cls === 'good' ? 'var(--fn-green)' : runwayTag.cls === 'warn' ? 'var(--fn-bronze)' : 'var(--fn-red)');

      var advice = [];
      if (margin < 0) {
        advice.push({ icon: ICONS.warn, cls: 'red', title: 'Đang lỗ trong 3 tháng gần nhất', desc: 'Doanh thu không đủ bù chi phí. Rà soát lại đơn giá thi công/thiết kế, cắt giảm chi phí phát sinh ngoài dự toán, và ưu tiên thu hồi công nợ khách hàng để cải thiện dòng tiền.' });
      } else if (margin < 15) {
        advice.push({ icon: ICONS.warn, cls: 'bronze', title: 'Biên lợi nhuận còn mỏng', desc: 'Biên lợi nhuận dưới 15% — nên xem lại chính sách chiết khấu cho khách và kiểm soát chi phí vật liệu/nhân công trên từng dự án.' });
      } else {
        advice.push({ icon: ICONS.check, cls: 'green', title: 'Biên lợi nhuận khoẻ mạnh', desc: 'Duy trì kỷ luật báo giá và kiểm soát chi phí như hiện tại; có thể cân nhắc trích thêm quỹ dự phòng hoặc mở rộng đầu tư.' });
      }
      if (debtRatio > 60) {
        advice.push({ icon: ICONS.debt, cls: 'red', title: 'Đòn bẩy nợ cao so với doanh thu', desc: 'Dư nợ vay đang lớn hơn nhiều so với doanh thu 3 tháng. Ưu tiên dùng dòng tiền thu về để trả bớt nợ trước khi vay thêm cho dự án mới.' });
      } else if (debtRatio > 30) {
        advice.push({ icon: ICONS.debt, cls: 'bronze', title: 'Theo dõi sát khoản vay', desc: 'Tỷ lệ nợ/doanh thu ở mức trung bình — lên lịch trả nợ rõ ràng để tránh dồn áp lực dòng tiền vào cuối năm.' });
      }
      if (runwayMonths < 1) {
        advice.push({ icon: ICONS.warn, cls: 'red', title: 'Dự trữ tiền mặt rất thấp', desc: 'Quỹ hiện tại không đủ chi cho 1 tháng hoạt động nếu không có doanh thu mới. Cần thu hồi công nợ và hạn chế chi phí không thiết yếu ngay.' });
      } else if (runwayMonths < 3) {
        advice.push({ icon: ICONS.idle, cls: 'bronze', title: 'Nên tăng quỹ dự phòng', desc: 'Dự trữ tiền mặt dưới 3 tháng chi phí hoạt động — nên giữ lại một phần lợi nhuận các tháng lãi để làm quỹ đệm.' });
      }
      document.getElementById('fnAdviceList').innerHTML = advice.map(function (a) {
        return '<div class="fn-advice-row">' +
          '<div class="fn-advice-icon" style="background:color-mix(in srgb, var(--fn-' + a.cls + ') 14%, transparent);color:var(--fn-' + a.cls + ');">' + a.icon + '</div>' +
          '<div><div class="fn-advice-title">' + a.title + '</div><div class="fn-advice-desc">' + a.desc + '</div></div>' +
        '</div>';
      }).join('');
    }

    // ============================== SỔ TAY CFO ==============================
    function div(a, b) { return b ? a / b : 0; }
    function pct1(n) { return (n * 100).toFixed(1) + '%'; }
    function num2(n) { return (Number(n) || 0).toFixed(2); }
    function verdictTag(cls, text) { return '<span class="fn-verdict ' + cls + '">' + text + '</span>'; }

    function renderCfoHandbook(all) {
      var yearSelect = document.getElementById('fnCfoYear');
      if (!yearSelect) return;
      var year = yearSelect.value || String(new Date().getFullYear());
      var snap = TaskManager.getBsSnapshotByYear(year) || {};
      var f = function (k) { return Number(snap[k]) || 0; };

      var shortTermAssets = f('shortTermAssets'), inventory = f('inventory'), totalAssets = f('totalAssets'),
        shortTermLiabilities = f('shortTermLiabilities'), shortTermDebt = f('shortTermDebt'), longTermDebt = f('longTermDebt'),
        totalLiabilities = f('totalLiabilities'), equity = f('equity'), interestExpense = f('interestExpense'),
        capex = f('capex'), marketCapInput = f('marketCap'), retainedEarnings = f('retainedEarnings');
      var marketCap = marketCapInput > 0 ? marketCapInput : equity;

      var yearEntries = all.filter(function (e) { return (e.month || '').slice(0, 4) === String(year); });
      var revenue = sumByType(yearEntries, 'revenue');
      var cogs = sumByType(yearEntries, 'expense'); // Giá vốn hàng bán ước tính = tổng chi phí ghi nhận trong sổ giao dịch
      var bonus = sumByType(yearEntries, 'bonus');
      var penalty = sumByType(yearEntries, 'penalty');
      var loanY = sumByType(yearEntries, 'loan');
      var repaymentY = sumByType(yearEntries, 'repayment');
      var grossProfit = revenue - cogs;
      var ebit = grossProfit - bonus + penalty; // trước lãi vay & thuế
      var pnlBeforeTax = ebit - interestExpense; // LNTT sau lãi vay
      var netProfit = pnlBeforeTax; // LNST — công ty nhỏ, chưa tách thuế TNDN riêng trong sổ

      var cashNow = all.reduce(function (sum, e) {
        var t = TYPES[e.type];
        return sum + (t ? t.cashSign : 0) * (Number(e.amount) || 0);
      }, 0);
      var receivablesOutstanding = (TaskManager.getReceivables() || [])
        .filter(function (r) { return r.status !== 'paid'; })
        .reduce(function (s, r) { return s + (Number(r.amount) || 0); }, 0);

      // ---- Bảng số liệu tự động liên kết từ Sổ giao dịch ----
      var autoRows = [
        { label: 'Doanh thu thuần', source: 'Tổng giao dịch loại "Doanh thu" trong năm ' + year, value: revenue },
        { label: 'Giá vốn hàng bán (ước tính)', source: 'Tổng giao dịch loại "Chi phí" trong năm ' + year, value: cogs },
        { label: 'Lợi nhuận gộp', source: 'Doanh thu thuần − Giá vốn hàng bán', value: grossProfit },
        { label: 'Thưởng nhân viên', source: 'Tổng giao dịch loại "Thưởng nhân viên"', value: bonus },
        { label: 'Phạt nhân viên (thu về)', source: 'Tổng giao dịch loại "Phạt nhân viên"', value: penalty },
        { label: 'EBIT (trước lãi vay & thuế)', source: 'Lợi nhuận gộp − Thưởng + Phạt', value: ebit },
        { label: 'LNST (sau lãi vay đã nhập)', source: 'EBIT − Chi phí lãi vay đã nhập ở bảng trên', value: netProfit },
        { label: 'Tiền & tương đương tiền hiện có', source: 'Luỹ kế toàn bộ sổ giao dịch tới hiện tại', value: cashNow },
        { label: 'Phải thu ngắn hạn (công nợ chưa thu)', source: 'Tổng "Công nợ khách hàng" chưa đánh dấu Đã thu', value: receivablesOutstanding },
        { label: 'Vay nhận trong năm', source: 'Tổng giao dịch loại "Vay nợ (nhận)" trong năm ' + year, value: loanY },
        { label: 'Trả nợ gốc trong năm', source: 'Tổng giao dịch loại "Trả nợ" trong năm ' + year, value: repaymentY }
      ];
      document.getElementById('fnCfoAutoRows').innerHTML = autoRows.map(function (r) {
        return '<tr><td>' + r.label + '</td><td class="fn-formula-cell">' + r.source + '</td><td class="fn-amount ' + (r.value >= 0 ? 'pos' : 'neg') + '">' + fmt(r.value) + '</td></tr>';
      }).join('');

      // ---- 1. Bức tranh tổng quan ----
      document.getElementById('fnCfoOverviewGrid').innerHTML =
        summaryCard('Tổng tài sản (' + year + ')', totalAssets, 'neutral', ICONS.overview, 'bronze', 'Nhập tay') +
        summaryCard('Vốn chủ sở hữu', equity, 'neutral', ICONS.debt, 'green', 'Nhập tay') +
        summaryCard('Doanh thu thuần ' + year, revenue, 'pos', ICONS.pnl, 'bronze', 'Từ sổ giao dịch') +
        summaryCard('Lợi nhuận sau thuế ' + year, netProfit, netProfit >= 0 ? 'pos' : 'neg', ICONS.pnl, netProfit >= 0 ? 'green' : 'red', 'Ước tính');

      var overviewNotes = [];
      if (totalAssets === 0 || shortTermLiabilities === 0) {
        overviewNotes.push('Chưa nhập đủ số liệu bảng cân đối kế toán năm ' + year + ' — điền vào biểu mẫu phía trên để các nhóm chỉ số bên dưới tính được chính xác.');
      }
      overviewNotes.push('Doanh thu và lợi nhuận lấy trực tiếp từ Sổ giao dịch (mục Giao dịch); Giá vốn hàng bán được ước tính bằng tổng chi phí đã ghi nhận trong năm do sổ chưa tách riêng giá vốn/chi phí quản lý.');
      if (netProfit < 0) {
        overviewNotes.push('Công ty đang lỗ trong năm ' + year + ' — nguyên nhân cốt lõi cần soi vào biên lợi nhuận gộp (mục 2.4) và tỷ lệ chi phí lãi vay/EBIT (mục 2.2) trước khi kết luận do vận hành hay do cấu trúc vốn.');
      }
      if (shortTermLiabilities > 0 && shortTermAssets > 0 && shortTermAssets / shortTermLiabilities < 1) {
        overviewNotes.push('Tài sản ngắn hạn đang thấp hơn nợ ngắn hạn — đây thường là nguyên nhân cốt lõi dẫn đến nghi ngờ khả năng hoạt động liên tục nếu công ty có kiểm toán độc lập.');
      }
      document.getElementById('fnCfoOverviewNote').innerHTML = overviewNotes.map(function (t) { return '<p style="margin:0 0 10px;">' + t + '</p>'; }).join('');

      // ---- 2.1 Thanh khoản ----
      var currentRatio = div(shortTermAssets, shortTermLiabilities);
      var quickRatio = div(shortTermAssets - inventory, shortTermLiabilities);
      var cashRatioV = div(cashNow, shortTermLiabilities);
      document.getElementById('fnCfoLiquidityRows').innerHTML =
        '<tr><td>Hệ số thanh toán hiện hành</td><td class="fn-formula-cell">TSNH / Nợ NH</td><td class="fn-formula-cell">' + fmt(shortTermAssets) + ' / ' + fmt(shortTermLiabilities) + '</td><td class="fn-amount">' + num2(currentRatio) + '</td><td>' + verdictTag(currentRatio >= 2 ? 'good' : currentRatio < 1 ? 'bad' : 'warn', currentRatio >= 2 ? 'Tốt' : currentRatio < 1 ? 'Báo động' : 'Trung bình') + '</td></tr>' +
        '<tr><td>Hệ số thanh toán nhanh</td><td class="fn-formula-cell">(TSNH − Tồn kho) / Nợ NH</td><td class="fn-formula-cell">(' + fmt(shortTermAssets) + ' − ' + fmt(inventory) + ') / ' + fmt(shortTermLiabilities) + '</td><td class="fn-amount">' + num2(quickRatio) + '</td><td>' + verdictTag(quickRatio >= 1 ? 'good' : quickRatio < 0.5 ? 'bad' : 'warn', quickRatio >= 1 ? 'Lành mạnh' : quickRatio < 0.5 ? 'Cực kỳ rủi ro' : 'Trung bình') + '</td></tr>' +
        '<tr><td>Hệ số thanh toán tiền mặt</td><td class="fn-formula-cell">(Tiền + Tương đương tiền) / Nợ NH</td><td class="fn-formula-cell">' + fmt(cashNow) + ' / ' + fmt(shortTermLiabilities) + '</td><td class="fn-amount">' + num2(cashRatioV) + '</td><td>' + verdictTag(cashRatioV >= 0.2 ? 'good' : cashRatioV < 0.1 ? 'bad' : 'warn', cashRatioV >= 0.2 ? 'Đệm tốt' : cashRatioV < 0.1 ? 'Rất mỏng' : 'Trung bình') + '</td></tr>';

      // ---- 2.2 Đòn bẩy ----
      var debtToAssets = div(totalLiabilities, totalAssets);
      var debtToEquity = div(shortTermDebt + longTermDebt, equity);
      var interestCoverage = interestExpense > 0 ? div(pnlBeforeTax + interestExpense, interestExpense) : null;
      document.getElementById('fnCfoLeverageRows').innerHTML =
        '<tr><td>Nợ trên Tổng tài sản</td><td class="fn-formula-cell">Tổng nợ phải trả / Tổng TS</td><td class="fn-formula-cell">' + fmt(totalLiabilities) + ' / ' + fmt(totalAssets) + '</td><td class="fn-amount">' + pct1(debtToAssets) + '</td><td>' + verdictTag(debtToAssets <= 0.65 ? 'good' : debtToAssets > 0.8 ? 'bad' : 'warn', debtToAssets <= 0.65 ? 'An toàn' : debtToAssets > 0.8 ? 'Báo động đỏ' : 'Trung bình') + '</td></tr>' +
        '<tr><td>Nợ vay trên Vốn chủ sở hữu</td><td class="fn-formula-cell">(Vay NH + Vay DH) / VCSH</td><td class="fn-formula-cell">(' + fmt(shortTermDebt) + ' + ' + fmt(longTermDebt) + ') / ' + fmt(equity) + '</td><td class="fn-amount">' + num2(debtToEquity) + ' lần</td><td>' + verdictTag(debtToEquity <= 1 ? 'good' : debtToEquity > 3 ? 'bad' : 'warn', debtToEquity <= 1 ? 'Thận trọng (tham khảo)' : debtToEquity > 3 ? 'Rủi ro cao (tham khảo)' : 'Trung bình (tham khảo)') + '</td></tr>' +
        '<tr><td>Hệ số chi trả lãi vay</td><td class="fn-formula-cell">(LNTT + Chi phí lãi vay) / Chi phí lãi vay</td><td class="fn-formula-cell">(' + fmt(pnlBeforeTax) + ' + ' + fmt(interestExpense) + ') / ' + fmt(interestExpense) + '</td><td class="fn-amount">' + (interestCoverage === null ? 'N/A (chưa có lãi vay)' : num2(interestCoverage) + ' lần') + '</td><td>' + (interestCoverage === null ? '' : verdictTag(interestCoverage >= 1.5 ? 'good' : interestCoverage < 1 ? 'bad' : 'warn', interestCoverage >= 1.5 ? 'An toàn (tham khảo)' : interestCoverage < 1 ? 'Không đủ trả lãi (tham khảo)' : 'Sát ngưỡng (tham khảo)')) + '</td></tr>';

      // ---- 2.3 Hiệu quả hoạt động ----
      var dso = revenue > 0 ? div(receivablesOutstanding * 365, revenue) : 0;
      var dio = cogs > 0 ? div(inventory * 365, cogs) : 0;
      document.getElementById('fnCfoEfficiencyRows').innerHTML =
        '<tr><td>Số ngày thu tiền bình quân (DSO)</td><td class="fn-formula-cell">(Phải thu NH × 365) / DTT</td><td class="fn-formula-cell">(' + fmt(receivablesOutstanding) + ' × 365) / ' + fmt(revenue) + '</td><td class="fn-amount">' + Math.round(dso) + ' ngày</td></tr>' +
        '<tr><td>Số ngày tồn kho bình quân (DIO)</td><td class="fn-formula-cell">(Hàng tồn kho × 365) / GVHB</td><td class="fn-formula-cell">(' + fmt(inventory) + ' × 365) / ' + fmt(cogs) + '</td><td class="fn-amount">' + Math.round(dio) + ' ngày</td></tr>';

      // ---- 2.4 Sinh lời ----
      var gpm = div(grossProfit, revenue);
      var npm = div(netProfit, revenue);
      var roa = div(netProfit, totalAssets);
      var roe = div(netProfit, equity);
      document.getElementById('fnCfoProfitRows').innerHTML =
        '<tr><td>Biên lợi nhuận gộp (GPM)</td><td class="fn-formula-cell">LN gộp / DTT</td><td class="fn-formula-cell">' + fmt(grossProfit) + ' / ' + fmt(revenue) + '</td><td class="fn-amount ' + (gpm >= 0 ? 'pos' : 'neg') + '">' + pct1(gpm) + '</td></tr>' +
        '<tr><td>Biên lợi nhuận ròng (NPM)</td><td class="fn-formula-cell">LNST / DTT</td><td class="fn-formula-cell">' + fmt(netProfit) + ' / ' + fmt(revenue) + '</td><td class="fn-amount ' + (npm >= 0 ? 'pos' : 'neg') + '">' + pct1(npm) + '</td></tr>' +
        '<tr><td>ROA</td><td class="fn-formula-cell">LNST / Tổng tài sản</td><td class="fn-formula-cell">' + fmt(netProfit) + ' / ' + fmt(totalAssets) + '</td><td class="fn-amount ' + (roa >= 0 ? 'pos' : 'neg') + '">' + pct1(roa) + '</td></tr>' +
        '<tr><td>ROE</td><td class="fn-formula-cell">LNST / Vốn chủ sở hữu</td><td class="fn-formula-cell">' + fmt(netProfit) + ' / ' + fmt(equity) + '</td><td class="fn-amount ' + (roe >= 0 ? 'pos' : 'neg') + '">' + pct1(roe) + '</td></tr>';

      // ---- 3. Altman Z-Score ----
      var X1 = div(shortTermAssets - shortTermLiabilities, totalAssets);
      var X2 = div(retainedEarnings, totalAssets);
      var X3 = div(ebit, totalAssets);
      var X4 = div(marketCap, totalLiabilities);
      var X5 = div(revenue, totalAssets);
      var Z = 1.2 * X1 + 1.4 * X2 + 3.3 * X3 + 0.6 * X4 + 1.0 * X5;
      var zCls = Z > 2.99 ? 'good' : Z < 1.81 ? 'bad' : 'warn';
      var zText = Z > 2.99 ? 'An toàn' : Z < 1.81 ? 'Nguy hiểm' : 'Cảnh báo';
      document.getElementById('fnCfoZscore').innerHTML =
        '<div class="fn-card-head"><div class="fn-card-title">Kết quả Z-Score năm ' + year + '</div>' + verdictTag(zCls, zText + ' · Z = ' + num2(Z)) + '</div>' +
        '<table class="fn-table"><thead><tr><th>Biến số</th><th>Công thức</th><th>Số liệu thay vào</th><th>Kết quả</th></tr></thead><tbody>' +
        '<tr><td>X1 — Vốn lưu động / Tổng TS</td><td class="fn-formula-cell">(TSNH − Nợ NH) / Tổng TS</td><td class="fn-formula-cell">(' + fmt(shortTermAssets) + ' − ' + fmt(shortTermLiabilities) + ') / ' + fmt(totalAssets) + '</td><td class="fn-amount">' + num2(X1) + '</td></tr>' +
        '<tr><td>X2 — LNST lũy kế / Tổng TS</td><td class="fn-formula-cell">LNST chưa phân phối / Tổng TS</td><td class="fn-formula-cell">' + fmt(retainedEarnings) + ' / ' + fmt(totalAssets) + '</td><td class="fn-amount">' + num2(X2) + '</td></tr>' +
        '<tr><td>X3 — EBIT / Tổng TS</td><td class="fn-formula-cell">(LNTT + Chi phí lãi vay) / Tổng TS</td><td class="fn-formula-cell">' + fmt(ebit) + ' / ' + fmt(totalAssets) + '</td><td class="fn-amount">' + num2(X3) + '</td></tr>' +
        '<tr><td>X4 — Vốn hóa / Tổng nợ phải trả</td><td class="fn-formula-cell">Vốn hóa thị trường / Tổng nợ phải trả</td><td class="fn-formula-cell">' + fmt(marketCap) + (marketCapInput <= 0 ? ' (mặc định = VCSH sổ sách vì công ty chưa niêm yết)' : '') + ' / ' + fmt(totalLiabilities) + '</td><td class="fn-amount">' + num2(X4) + '</td></tr>' +
        '<tr><td>X5 — Vòng quay tổng tài sản</td><td class="fn-formula-cell">DTT / Tổng TS</td><td class="fn-formula-cell">' + fmt(revenue) + ' / ' + fmt(totalAssets) + '</td><td class="fn-amount">' + num2(X5) + '</td></tr>' +
        '<tr class="total"><td>Z = 1,2(X1) + 1,4(X2) + 3,3(X3) + 0,6(X4) + 1,0(X5)</td><td></td><td></td><td class="fn-amount">' + num2(Z) + '</td></tr>' +
        '</tbody></table>';

      // ---- 4. Dòng tiền ----
      var cfo = revenue - cogs - bonus + penalty;
      var cfi = -capex;
      var cff = loanY - repaymentY;
      var fcf = cfo - capex;
      document.getElementById('fnCfoCashflowRows').innerHTML =
        '<tr><td>HĐ Kinh doanh (CFO)</td><td class="fn-formula-cell">Doanh thu − Giá vốn − Thưởng + Phạt (từ sổ giao dịch)</td><td class="fn-amount ' + (cfo >= 0 ? 'pos' : 'neg') + '">' + fmt(cfo) + '</td></tr>' +
        '<tr><td>HĐ Đầu tư (CFI)</td><td class="fn-formula-cell">− CAPEX (chi mua sắm TSCĐ đã nhập)</td><td class="fn-amount ' + (cfi >= 0 ? 'pos' : 'neg') + '">' + fmt(cfi) + '</td></tr>' +
        '<tr><td>HĐ Tài chính (CFF)</td><td class="fn-formula-cell">Tiền vay nhận − Tiền trả nợ gốc (từ sổ giao dịch)</td><td class="fn-amount ' + (cff >= 0 ? 'pos' : 'neg') + '">' + fmt(cff) + '</td></tr>' +
        '<tr class="total"><td>Dòng tiền tự do (FCF)</td><td class="fn-formula-cell">CFO − CAPEX</td><td class="fn-amount ' + (fcf >= 0 ? 'pos' : 'neg') + '">' + fmt(fcf) + '</td></tr>';

      // ---- 5. Tư vấn chiến lược ----
      var advice = [];
      if (currentRatio > 0 && currentRatio < 1) {
        advice.push({ icon: ICONS.warn, cls: 'red', title: 'Tái cấu trúc vốn lưu động khẩn cấp', desc: 'Hệ số thanh toán hiện hành dưới 1 — tài sản ngắn hạn không đủ che nợ ngắn hạn. Ưu tiên đàm phán giãn nợ nhà cung cấp/ngân hàng và hạn chế nhận thầu mới cần ứng vốn lớn cho tới khi tỷ lệ này về trên 1,0.' });
      }
      if (dso > 90) {
        advice.push({ icon: ICONS.customers, cls: 'bronze', title: 'Siết công nợ khách hàng', desc: 'DSO ' + Math.round(dso) + ' ngày cho thấy tiền đang bị "giam" ở khách hàng quá lâu. Áp dụng điều khoản thanh toán theo mốc nghiệm thu chặt hơn ngay từ hợp đồng mới, và ưu tiên thu hồi các khoản công nợ quá hạn ở mục Công nợ khách hàng.' });
      }
      if (debtToAssets > 0.65) {
        advice.push({ icon: ICONS.debt, cls: debtToAssets > 0.8 ? 'red' : 'bronze', title: 'Kiểm soát đòn bẩy nợ', desc: 'Nợ phải trả chiếm ' + pct1(debtToAssets) + ' tổng tài sản — vượt ngưỡng an toàn 65%. Hạn chế vay mới, ưu tiên dùng dòng tiền thu hồi công nợ để giảm dư nợ trước khi mở rộng quy mô.' });
      }
      if (gpm < 0.15 && revenue > 0) {
        advice.push({ icon: ICONS.pnl, cls: 'bronze', title: 'Rà soát chiến lược đấu thầu', desc: 'Biên lợi nhuận gộp ' + pct1(gpm) + ' khá mỏng cho ngành thiết kế — thi công nội thất. Chỉ nhận các dự án có đơn giá đủ bù chi phí vật liệu/nhân công thực tế, tránh cạnh tranh bằng giá thấp.' });
      }
      if (Z < 1.81 && totalAssets > 0) {
        advice.push({ icon: ICONS.warn, cls: 'red', title: 'Ưu tiên số một: ổn định tài chính', desc: 'Z-Score ' + num2(Z) + ' nằm trong vùng nguy hiểm. Toàn bộ quyết định đầu tư/mở rộng nên tạm hoãn, tập trung dòng tiền vào thu hồi công nợ và trả bớt nợ vay trong 2–3 quý tới.' });
      }
      if (fcf < 0 && (capex > 0 || cfo !== 0)) {
        advice.push({ icon: ICONS.forecast, cls: 'bronze', title: 'Cân đối lại kế hoạch đầu tư', desc: 'Dòng tiền tự do (FCF) đang âm — công ty đang chi nhiều hơn dòng tiền hoạt động tạo ra. Cân nhắc giãn tiến độ mua sắm tài sản cố định (CAPEX) không cấp thiết.' });
      }
      if (advice.length === 0) {
        advice.push({ icon: ICONS.check, cls: 'green', title: 'Nền tảng tài chính ổn định', desc: 'Các chỉ số thanh khoản, đòn bẩy và Z-Score hiện đều trong ngưỡng an toàn. Duy trì kỷ luật thu hồi công nợ và kiểm soát chi phí để giữ vững vị thế này khi mở rộng quy mô.' });
      }
      document.getElementById('fnCfoAdviceList').innerHTML = advice.map(function (a) {
        return '<div class="fn-advice-row">' +
          '<div class="fn-advice-icon" style="background:color-mix(in srgb, var(--fn-' + a.cls + ') 14%, transparent);color:var(--fn-' + a.cls + ');">' + a.icon + '</div>' +
          '<div><div class="fn-advice-title">' + a.title + '</div><div class="fn-advice-desc">' + a.desc + '</div></div>' +
        '</div>';
      }).join('');
    }

    // ============================== RISK ==============================
    var SEV_LABEL = { good: 'Thấp', warn: 'Trung bình', bad: 'Cao', neutral: 'Thiếu dữ liệu' };
    function riskRow(reg, group, name, formula, valueStr, threshold, severity, note) {
      reg.push({ group: group, name: name, severity: severity, note: note || '' });
      return '<tr><td>' + name + '</td><td class="fn-formula-cell">' + formula + '</td><td class="fn-amount">' + valueStr + '</td><td class="fn-formula-cell">' + threshold + '</td><td>' + verdictTag(severity, SEV_LABEL[severity]) + '</td></tr>';
    }

    function renderRisk(all, monthEntries, month) {
      var yearSelect = document.getElementById('fnCfoYear');
      var year = (yearSelect && yearSelect.value) || String(new Date().getFullYear());
      var snap = TaskManager.getBsSnapshotByYear(year);
      var f = function (k) { return snap ? (Number(snap[k]) || 0) : 0; };
      var hasSnap = !!snap;

      var shortTermAssets = f('shortTermAssets'), inventory = f('inventory'), totalAssets = f('totalAssets'),
        shortTermLiabilities = f('shortTermLiabilities'), shortTermDebt = f('shortTermDebt'), longTermDebt = f('longTermDebt'),
        totalLiabilities = f('totalLiabilities'), equity = f('equity'), interestExpense = f('interestExpense'),
        marketCapInput = f('marketCap'), retainedEarnings = f('retainedEarnings');
      var marketCap = marketCapInput > 0 ? marketCapInput : equity;
      var hasBalanceData = hasSnap && totalAssets > 0 && shortTermLiabilities > 0;

      var yearEntries = all.filter(function (e) { return (e.month || '').slice(0, 4) === String(year); });
      var revenue = sumByType(yearEntries, 'revenue');
      var cogs = sumByType(yearEntries, 'expense');
      var bonus = sumByType(yearEntries, 'bonus');
      var penalty = sumByType(yearEntries, 'penalty');
      var grossProfit = revenue - cogs;
      var ebit = grossProfit - bonus + penalty;
      var netProfit = ebit - interestExpense;

      var revenueM = sumByType(monthEntries, 'revenue');
      var expenseM = sumByType(monthEntries, 'expense');
      var pnlMonth = revenueM - expenseM - sumByType(monthEntries, 'bonus') + sumByType(monthEntries, 'penalty');
      var debtOutstanding = sumByType(all, 'loan') - sumByType(all, 'repayment');
      var idlePool = sumByType(all, 'idle') + sumByType(all, 'undisbursed');
      var cashNow = all.reduce(function (sum, e) {
        var t = TYPES[e.type];
        return sum + (t ? t.cashSign : 0) * (Number(e.amount) || 0);
      }, 0);

      var today = new Date().toISOString().split('T')[0];
      var receivables = TaskManager.getReceivables() || [];
      var unpaidReceivables = receivables.filter(function (r) { return r.status !== 'paid'; });
      var receivablesOutstanding = unpaidReceivables.reduce(function (s, r) { return s + (Number(r.amount) || 0); }, 0);
      var overdue = unpaidReceivables.filter(function (r) { return r.dueDate && r.dueDate < today; });
      var overdueTotal = overdue.reduce(function (s, r) { return s + (Number(r.amount) || 0); }, 0);
      var overdueRatio = div(overdueTotal, receivablesOutstanding);

      var reg = []; // đăng ký toàn bộ rủi ro đã đánh giá — dùng để đếm tổng hợp Cao/Trung bình/Thấp

      // ---- Thanh khoản ----
      if (hasBalanceData) {
        var currentRatio = div(shortTermAssets, shortTermLiabilities);
        var quickRatio = div(shortTermAssets - inventory, shortTermLiabilities);
        var cashRatioV = div(cashNow, shortTermLiabilities);
        document.getElementById('fnRiskLiquidityRows').innerHTML =
          riskRow(reg, 'Thanh khoản', 'Mất khả năng thanh toán ngắn hạn', 'TSNH / Nợ NH', num2(currentRatio) + ' lần', '≥2,0 Thấp · 1,0–2,0 Trung bình · <1,0 Cao', currentRatio >= 2 ? 'good' : currentRatio < 1 ? 'bad' : 'warn') +
          riskRow(reg, 'Thanh khoản', 'Không đủ tài sản dễ chuyển đổi', '(TSNH − Tồn kho) / Nợ NH', num2(quickRatio) + ' lần', '≥1,0 Thấp · 0,5–1,0 Trung bình · <0,5 Cao', quickRatio >= 1 ? 'good' : quickRatio < 0.5 ? 'bad' : 'warn') +
          riskRow(reg, 'Thanh khoản', 'Đệm tiền mặt quá mỏng', '(Tiền + Tương đương tiền) / Nợ NH', num2(cashRatioV), '≥0,2 Thấp · 0,1–0,2 Trung bình · <0,1 Cao', cashRatioV >= 0.2 ? 'good' : cashRatioV < 0.1 ? 'bad' : 'warn');
      } else {
        document.getElementById('fnRiskLiquidityRows').innerHTML = '<tr><td colspan="5" class="fn-empty">Chưa nhập số liệu bảng cân đối kế toán năm ' + year + ' — bổ sung tại mục "Báo cáo tài chính" để tính nhóm này.</td></tr>';
      }

      // ---- Đòn bẩy & cấu trúc vốn ----
      if (hasBalanceData) {
        var debtToAssets = div(totalLiabilities, totalAssets);
        var debtToEquity = div(shortTermDebt + longTermDebt, equity);
        var interestCoverage = interestExpense > 0 ? div(netProfit + interestExpense, interestExpense) : null;
        document.getElementById('fnRiskLeverageRows').innerHTML =
          riskRow(reg, 'Đòn bẩy', 'Nợ chiếm tỷ trọng quá lớn trong tài sản', 'Tổng nợ phải trả / Tổng TS', pct1(debtToAssets), '≤65% Thấp · 65–80% Trung bình · >80% Cao', debtToAssets <= 0.65 ? 'good' : debtToAssets > 0.8 ? 'bad' : 'warn') +
          riskRow(reg, 'Đòn bẩy', 'Vay nợ vượt vốn tự có', '(Vay NH + Vay DH) / VCSH', num2(debtToEquity) + ' lần', '≤1,0 Thấp · 1,0–3,0 Trung bình · >3,0 Cao', debtToEquity <= 1 ? 'good' : debtToEquity > 3 ? 'bad' : 'warn') +
          riskRow(reg, 'Đòn bẩy', 'Không đủ khả năng trả lãi vay', '(LNTT + Chi phí lãi vay) / Chi phí lãi vay', interestCoverage === null ? 'N/A' : num2(interestCoverage) + ' lần', '≥1,5 Thấp · 1,0–1,5 Trung bình · <1,0 Cao', interestCoverage === null ? 'neutral' : interestCoverage >= 1.5 ? 'good' : interestCoverage < 1 ? 'bad' : 'warn');
      } else {
        document.getElementById('fnRiskLeverageRows').innerHTML = '<tr><td colspan="5" class="fn-empty">Chưa nhập số liệu bảng cân đối kế toán năm ' + year + ' — bổ sung tại mục "Báo cáo tài chính" để tính nhóm này.</td></tr>';
      }

      // ---- Dòng tiền ----
      var workingCapital = hasBalanceData ? (shortTermAssets - shortTermLiabilities) : null;
      document.getElementById('fnRiskCashRows').innerHTML =
        riskRow(reg, 'Dòng tiền', 'Chi vượt thu trong tháng ' + month, 'Doanh thu − Chi phí − Thưởng + Phạt (tháng)', fmt(pnlMonth), '≥0 Thấp · <0 Cao', pnlMonth >= 0 ? 'good' : 'bad') +
        riskRow(reg, 'Dòng tiền', 'Dòng tiền tồn luỹ kế cạn kiệt', 'Luỹ kế Thu − Chi toàn bộ sổ giao dịch', fmt(cashNow), '≥0 Thấp · <0 Cao', cashNow >= 0 ? 'good' : 'bad') +
        (workingCapital !== null
          ? riskRow(reg, 'Dòng tiền', 'Vốn lưu động ròng âm', 'Tài sản ngắn hạn − Nợ ngắn hạn', fmt(workingCapital), '≥0 Thấp · <0 Cao', workingCapital >= 0 ? 'good' : 'bad')
          : '<tr><td>Vốn lưu động ròng âm</td><td class="fn-formula-cell">Tài sản ngắn hạn − Nợ ngắn hạn</td><td colspan="3" class="fn-empty" style="text-align:left;padding-left:14px;">Chưa nhập số liệu bảng cân đối kế toán năm ' + year + '</td></tr>');

      // ---- Công nợ & thu hồi ----
      var dso = revenue > 0 ? div(receivablesOutstanding * 365, revenue) : null;
      document.getElementById('fnRiskReceivableRows').innerHTML =
        (dso !== null
          ? riskRow(reg, 'Công nợ', 'Thu tiền khách hàng quá chậm (DSO)', '(Phải thu NH × 365) / DTT', Math.round(dso) + ' ngày', '<90 Thấp · 90–180 Trung bình · >180 Cao', dso < 90 ? 'good' : dso > 180 ? 'bad' : 'warn')
          : '<tr><td>Thu tiền khách hàng quá chậm (DSO)</td><td class="fn-formula-cell">(Phải thu NH × 365) / DTT</td><td colspan="3" class="fn-empty" style="text-align:left;padding-left:14px;">Chưa có doanh thu năm ' + year + ' để tính</td></tr>') +
        riskRow(reg, 'Công nợ', 'Tỷ lệ công nợ quá hạn trên tổng công nợ chưa thu', 'Công nợ quá hạn / Tổng công nợ chưa thu', receivablesOutstanding > 0 ? pct1(overdueRatio) : '0,0%', '0% Thấp · 1–30% Trung bình · >30% Cao', overdueRatio === 0 ? 'good' : overdueRatio > 0.3 ? 'bad' : 'warn') +
        riskRow(reg, 'Công nợ', overdue.length + ' khoản công nợ đã quá hạn thanh toán', 'Đếm số dòng "Công nợ khách hàng" có hạn < hôm nay và chưa đánh dấu Đã thu', fmt(overdueTotal), '0 khoản Thấp · ≥1 khoản Cao', overdue.length === 0 ? 'good' : 'bad');

      // ---- Sinh lời ----
      var gpm = revenue > 0 ? div(grossProfit, revenue) : null;
      var npm = revenue > 0 ? div(netProfit, revenue) : null;
      document.getElementById('fnRiskProfitRows').innerHTML =
        (gpm !== null
          ? riskRow(reg, 'Sinh lời', 'Biên lợi nhuận gộp quá mỏng', 'Lợi nhuận gộp / DTT', pct1(gpm), '≥20% Thấp · 10–20% Trung bình · <10% Cao', gpm >= 0.2 ? 'good' : gpm < 0.1 ? 'bad' : 'warn')
          : '<tr><td>Biên lợi nhuận gộp quá mỏng</td><td class="fn-formula-cell">Lợi nhuận gộp / DTT</td><td colspan="3" class="fn-empty" style="text-align:left;padding-left:14px;">Chưa có doanh thu năm ' + year + ' để tính</td></tr>') +
        (npm !== null
          ? riskRow(reg, 'Sinh lời', 'Kinh doanh thua lỗ', 'LNST / DTT', pct1(npm), '≥0% Thấp · <0% Cao', npm >= 0 ? 'good' : 'bad')
          : '<tr><td>Kinh doanh thua lỗ</td><td class="fn-formula-cell">LNST / DTT</td><td colspan="3" class="fn-empty" style="text-align:left;padding-left:14px;">Chưa có doanh thu năm ' + year + ' để tính</td></tr>');

      // ---- Chi phí & vận hành ----
      var cats = categoryBreakdown(monthEntries);
      var totalExp = cats.reduce(function (s, c) { return s + c.value; }, 0);
      var topCatRatio = totalExp > 0 ? div(cats[0].value, totalExp) : 0;
      document.getElementById('fnRiskOpsRows').innerHTML =
        riskRow(reg, 'Vận hành', 'Chi phí tháng tập trung vào 1 danh mục' + (cats.length ? ' ("' + cats[0].name + '")' : ''), 'Chi phí lớn nhất / Tổng chi phí tháng', totalExp > 0 ? pct1(topCatRatio) : '0,0%', '≤40% Thấp · >40% Cao', totalExp === 0 || topCatRatio <= 0.4 ? 'good' : 'bad') +
        riskRow(reg, 'Vận hành', 'Tiền ứ đọng / chưa giải ngân', 'Tổng giao dịch loại "Ứ đọng" + "Chưa giải ngân"', fmt(idlePool), '0 Thấp · >0 Cần theo dõi', idlePool === 0 ? 'good' : 'warn') +
        riskRow(reg, 'Vận hành', 'Còn dư nợ vay chưa trả hết', 'Tổng "Vay nợ (nhận)" − Tổng "Trả nợ" (luỹ kế)', fmt(debtOutstanding), '0 Thấp · >0 Cần theo dõi', debtOutstanding === 0 ? 'good' : 'warn');

      // ---- Altman Z-Score ----
      if (hasBalanceData) {
        var X1 = div(shortTermAssets - shortTermLiabilities, totalAssets);
        var X2 = div(retainedEarnings, totalAssets);
        var X3 = div(ebit, totalAssets);
        var X4 = div(marketCap, totalLiabilities);
        var X5 = div(revenue, totalAssets);
        var Z = 1.2 * X1 + 1.4 * X2 + 3.3 * X3 + 0.6 * X4 + 1.0 * X5;
        document.getElementById('fnRiskZRows').innerHTML =
          riskRow(reg, 'Phá sản', 'Nguy cơ kiệt quệ tài chính (Altman Z-Score)', 'Z = 1,2X1+1,4X2+3,3X3+0,6X4+1,0X5', num2(Z), '>2,99 Thấp · 1,81–2,99 Trung bình · <1,81 Cao', Z > 2.99 ? 'good' : Z < 1.81 ? 'bad' : 'warn');
      } else {
        document.getElementById('fnRiskZRows').innerHTML = '<tr><td colspan="5" class="fn-empty">Chưa nhập số liệu bảng cân đối kế toán năm ' + year + ' — bổ sung tại mục "Báo cáo tài chính" để tính Z-Score.</td></tr>';
      }

      // ---- Tổng hợp mức độ rủi ro ----
      var counts = { bad: 0, warn: 0, good: 0, neutral: 0 };
      reg.forEach(function (r) { counts[r.severity]++; });
      document.getElementById('fnRiskSummaryGrid').innerHTML =
        summaryCard('Rủi ro Cao', counts.bad, counts.bad > 0 ? 'neg' : 'pos', ICONS.warn, 'red', 'Cần xử lý ngay') +
        summaryCard('Rủi ro Trung bình', counts.warn, counts.warn > 0 ? 'neutral' : 'pos', ICONS.idle, 'bronze', 'Cần theo dõi') +
        summaryCard('Rủi ro Thấp', counts.good, 'pos', ICONS.check, 'green', 'Đang an toàn') +
        summaryCard('Thiếu dữ liệu', counts.neutral, 'neutral', ICONS.overview, 'bronze', 'Bổ sung để tính đủ');

      // ---- Điểm cần chú ý ngay (chỉ hiển thị Cao/Trung bình) ----
      var attention = reg.filter(function (r) { return r.severity === 'bad' || r.severity === 'warn'; })
        .sort(function (a, b) { return (a.severity === 'bad' ? 0 : 1) - (b.severity === 'bad' ? 0 : 1); });
      var attentionHtml;
      if (attention.length === 0) {
        attentionHtml = '<div class="fn-attention-row">' +
          '<div class="fn-attention-icon" style="background:color-mix(in srgb, var(--fn-green) 14%, transparent);color:var(--fn-green);">' + ICONS.check + '</div>' +
          '<div class="fn-attention-body"><div class="fn-attention-title">Không phát hiện rủi ro nổi bật</div><div class="fn-attention-sub">Toàn bộ chỉ số đang trong ngưỡng an toàn hoặc trung bình</div></div>' +
        '</div>';
      } else {
        attentionHtml = attention.map(function (r) {
          var cls = r.severity === 'bad' ? 'red' : 'bronze';
          return '<div class="fn-attention-row">' +
            '<div class="fn-attention-icon" style="background:color-mix(in srgb, var(--fn-' + cls + ') 14%, transparent);color:var(--fn-' + cls + ');">' + ICONS.warn + '</div>' +
            '<div class="fn-attention-body"><div class="fn-attention-title">' + r.name + '</div><div class="fn-attention-sub">Nhóm: ' + r.group + '</div></div>' +
            '<div class="fn-attention-count" style="color:var(--fn-' + cls + ');">' + SEV_LABEL[r.severity] + '</div>' +
          '</div>';
        }).join('');
      }
      document.getElementById('fnRiskList').innerHTML = attentionHtml;
    }

    // ============================== EXPORT ==============================
    function exportReport() {
      if (typeof FinanceExport === 'undefined') { alert('Chưa tải xong bộ xuất báo cáo. Thử lại sau vài giây.'); return; }
      FinanceExport.open({ TaskManager: TaskManager, TYPES: TYPES, TYPE_ORDER: TYPE_ORDER, receivableStatus: receivableStatus, STATUS_LABEL: STATUS_LABEL, categoryBreakdown: categoryBreakdown, user: user });
    }

    function boot() {
      if (typeof TaskManager === 'undefined' || typeof Auth === 'undefined') { setTimeout(boot, 150); return; }
      if (Auth.getCurrentUser && !Auth.getCurrentUser()) { Auth.showLoginModal(); return; }
      render();
      if (TaskManager.loadFinanceAccess) TaskManager.loadFinanceAccess(function () { render(); });   // danh sách người được Founder cấp quyền (đọc từ Sheet)
      setTimeout(render, 1200); // re-render once the async Sheets fetch lands
    }
    boot();
  })();
  </script>
</body>
</html>
